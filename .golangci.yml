version: "2"
linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose            # forgot resp.Body.Close()
    - errorlint            # use errors.Is/As, not ==
    - misspell
    - revive               # style
    - gosec                # security smells
formatters:
  enable:
    - gofmt
    - goimports
