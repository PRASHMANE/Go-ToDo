# nginx site for Go-ToDo on the VM.
# Install: sudo cp deployments/prod/nginx/go-todo.conf /etc/nginx/sites-available/go-todo
#          sudo ln -s /etc/nginx/sites-available/go-todo /etc/nginx/sites-enabled/go-todo
#          sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d todo.example.com   (adds the 443 block for you)
server {
    listen 80;
    listen [::]:80;
    server_name todo.example.com;          # ← your domain (or the VPS IP for a first test)

    root /opt/go-todo/frontend/dist;
    index index.html;
    client_max_body_size 1m;

    # API → api-gateway running under supervisord on localhost
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build assets: cache for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths → index.html (React Router handles them)
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Security headers (inherited because the locations above use `expires`, not add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
