name: go-todo

x-go-service: &go-service            # YAML anchor: shared settings
  restart: unless-stopped

x-go-env: &go-env
  LOG_LEVEL: info
  GIN_MODE: release

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"           # host 15432 (your Mac may already run Postgres on 5432/5433); dev only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployments/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]   # JetStream on, storage dir, monitoring port
    ports:
      - "4222:4222"            # client port (for running services locally / the nats CLI)
      - "8222:8222"            # monitoring http
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- one-off migration jobs ----------
  auth-migrate:
    image: migrate/migrate:v4.20.1
    command: ["-path=/migrations", "-database=postgres://auth_user:auth_pass@postgres:5432/auth_db?sslmode=disable", "up"]
    volumes:
      - ./services/auth-service/migrations:/migrations:ro
    depends_on:
      postgres: { condition: service_healthy }

  todo-migrate:
    image: migrate/migrate:v4.20.1
    command: ["-path=/migrations", "-database=postgres://todo_user:todo_pass@postgres:5432/todo_db?sslmode=disable", "up"]
    volumes:
      - ./services/todo-service/migrations:/migrations:ro
    depends_on:
      postgres: { condition: service_healthy }

  activity-migrate:
    image: migrate/migrate:v4.20.1
    command: ["-path=/migrations", "-database=postgres://activity_user:activity_pass@postgres:5432/activity_db?sslmode=disable", "up"]
    volumes:
      - ./services/activity-service/migrations:/migrations:ro
    depends_on:
      postgres: { condition: service_healthy }

  # ---------- services ----------
  auth-service:
    <<: *go-service
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      <<: *go-env
      PORT: "8081"
      DATABASE_URL: postgres://auth_user:auth_pass@postgres:5432/auth_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: go-todo-auth
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      auth-migrate: { condition: service_completed_successfully }

  todo-service:
    <<: *go-service
    build:
      context: .
      dockerfile: services/todo-service/Dockerfile
    environment:
      <<: *go-env
      PORT: "8082"
      DATABASE_URL: postgres://todo_user:todo_pass@postgres:5432/todo_db?sslmode=disable
      NATS_URL: nats://nats:4222
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      todo-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  activity-service:
    <<: *go-service
    build:
      context: .
      dockerfile: services/activity-service/Dockerfile
    environment:
      <<: *go-env
      PORT: "8083"
      DATABASE_URL: postgres://activity_user:activity_pass@postgres:5432/activity_db?sslmode=disable
      NATS_URL: nats://nats:4222
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      activity-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  api-gateway:
    <<: *go-service
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      <<: *go-env
      PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:8081
      TODO_SERVICE_URL: http://todo-service:8082
      ACTIVITY_SERVICE_URL: http://activity-service:8083
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: go-todo-auth
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      TRUSTED_PROXIES: 172.16.0.0/12   # trust nginx (Docker's private range) → real client IP for rate limiting
    ports:
      - "8080:8080"            # the ONLY backend port published
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      auth-service: { condition: service_healthy }
      todo-service: { condition: service_healthy }
      activity-service: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "3000:80"
    depends_on:
      api-gateway: { condition: service_healthy }
    restart: unless-stopped

  # ---------- observability (opt-in: docker compose --profile observability up -d) ----------
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    profiles: ["observability"]

volumes:
  pgdata:
  natsdata:
